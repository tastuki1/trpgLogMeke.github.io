<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>NPCコマ作成ツール</title>
    <h1>NPCメーカー</h1>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <!-- <script type="text/javascript" src="./test.js"></script> -->
    <script type="text/javascript">
        Array.prototype.chunk = function (n) {
            len = Math.round(this.length / n, 10)
            ret = []
            for (var i = 0; i < len; i++) {
                ret.push(this.slice(i * n, i * n + n))
            }
            return ret;
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Noto+Sans+JP');
        @import url('https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic&family=BIZ+UDPMincho&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=New+Tegomin&family=Sawarabi+Mincho&display=swap');

        html {
            font-size: 16px;
        }

        body {
            -webkit-text-size-adjust: 100%;
            background-color: #6b8e23;
            font-family: sans-serif;
        }

        h1 {
            margin: 1rem 2rem 0;
            color: #ffffff;
            font-family: 'UD デジタル 教科書体 N-R', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
        }

        h2 {
            margin-bottom: .5rem;
        }

        h3 {
            margin: .5rem;
            color: #707070
        }

        .disp_check {
            padding-left: .5rem;
            border-collapse: separate;
            border-spacing: 0 1rem;
        }

        .disp_check th {
            vertical-align: top;
            white-space: nowrap;
        }

        .disp_check td {
            display: inline-block;
        }

        .value {
            width: 3rem;
            white-space: nowrap;
        }

        .growth {
            padding-left: 1rem;
        }

        caption {
            white-space: nowrap;
            text-align: left;
            padding-left: .5rem;
        }

        details {
            padding: .5rem;
            /* background-color: #e6ece3; */
            /* background-color: #ffffff; */
            border: 1px solid #e6ece3;
            border-left: 3px solid #6b8e23;
        }

        sammary {
            margin: 0rem;
        }

        .growth_box {
            /* margin: 1rem; */
            padding: .5rem;
            /* padding-top: 0rem; */

        }

        .box5 {
            padding: 1.5rem;
            margin: 1rem;
            border: double 5px #6b8e23;
            background-color: #ffffff;
        }

        .box5 p {
            margin: 0;
            padding: .5rem;
            text-align: left;
        }

        /* span {
            display:block;
            padding: .5rem 0rem;
            margin-left: .5rem;
        } */

        .sample input {
            display: none;
        }

        .sample label {
            display: block;
            float: left;
            cursor: pointer;
            width: 2rem;
            margin: 0;
            padding: .5rem;
            background: #bdc3c7;
            color: #869198;
            font-size: 12px;
            text-align: center;
            line-height: 1;
            transition: .2s;
        }

        .sample label:first-of-type {
            border-radius: 0px 0 0 0px;
        }

        .sample label:last-of-type {
            border-radius: 0 0px 0px 0;
        }

        .sample input[type="radio"]:checked+.switch-on {
            background-color: #a1b91d;
            color: #fff;
        }

        .sample input[type="radio"]:checked+.switch-off {
            background-color: #e67168;
            color: #fff;
        }

        .tab {
            position: relative;
            margin: 1rem 0 1rem 0;
            padding: .5rem 1.5rem .5rem 1rem;
            box-sizing: border-box;
            background: #f5f5f5;
            overflow-wrap: break-word;
        }

        .box {
            position: relative;
            margin: 2rem 1rem 1.5rem;
            padding: 1rem 1.5rem .5rem 1rem;
            border: solid 3px #707070;
            border-radius: 8px;
            background: #fff;
            line-height: 1.5;
        }

        .box .box-title {
            position: absolute;
            display: inline-block;
            top: -0.6rem;
            left: .5rem;
            padding: 0 .5rem;
            line-height: 1;
            background: #fff;
            color: #707070;
            font-weight: bold;
        }

        .box p {
            margin: 0;
            color: #707070;
        }


        @media screen and (max-width: 480px) {
            html {
                font-size: 14px;
            }

            h1 {
                font-size: 30px;
                margin: .5rem 1rem 0;
                color: #ffffff;
                font-family: 'UD デジタル 教科書体 N-R', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
            }

            .box5 {
                margin: .5rem;
                padding: 1rem;
            }

            .sample label {
                width: 2rem;
                padding: .5rem .2rem;

            }
        }

        /* PCの記載 */
        p.char {
            margin-left: .5rem;
            text-indent: -.5rem;
        }

        p.KP {
            margin-left: .5rem;
        }
    </style>
</head>

<body>
    <div class="box5">
        <div id="makeLog">
            作成するNPCのデータを入力してください．<br><br>
            <p>名前</p>
            <input type="text" id="char_name" v-model="char_name">
            <br>
            <p>ステータス</p>
            <textarea id="char_data" v-model="char_data" rows="4" cols="40"
            placeholder="以下のような形式に対応しています。
（例1）HP:XX POW:XX
（例2）DEX：XX,STR：XX"></textarea><br>
            <p>技能</p>
            <textarea id="char_skill" v-model="char_skill" rows="4" cols="40"
            placeholder="以下のような形式に対応しています。
（例1）日本刀:85 医学：60
（例2）＜こぶし＞65%,«回避»70%"></textarea><br><br>
            <input type="checkbox" id="secret" v-model="secretDice">シークレットダイスにする<br>
            <input type="radio" id="dice_ccb" value="CCB" v-model="dice">
            <label for="dice_ccb">CCB</label>
            <input type="radio" id="dice_cc" value="CC" v-model="dice">
            <label for="dice_cc">CC</label>
            <br><br>
            <button @click="makeNPC">コマ作成</button>
        </div>
</body>
<script>

    var makeLog = new Vue({
        el: "#makeLog",
        data: {
            dice:"CCB",
            secretDice:true,
            char_name:"",
            char_data:"",
            char_skill:"",
            char_commands:"",
            status:["HP","MP","SAN"],
            param:["STR","CON","DEX","POW","APP","SIZ","INT","EDU"],
            charCopyData: {
                "kind": "character",
                "data": {
                    "name": "",
                    "playerName": "",
                    "memo":"",
                    "initiative": 0,
                    "externalUrl": "",
                    "status":[],
                    "params":[],
                    "iconUrl": null,
                    "faces":[],
                    "x": 247,
                    "y": -247,
                    "z": 0,
                    "angle":0,
                    "width":4,
                    "height":4,
                    "active":true,
                    "secret":true,
                    "invisible": false,
                    "hideStatus": false,
                    "color": "#888888",
                    "commands":""
                }
            }
        },
        methods: {
            resetData() {
                this.charCopyData.data.name=""
                this.charCopyData.data.params=[]
                this.charCopyData.data.status=[]
                this.charCopyData.data.commands=""
                this.charCopyData.data.initiative=0
            },
            htmlSafe(str) {
                if (typeof str !== 'string') return str;
                var patterns = {
                    '<': '&lt;',
                    '>': '&gt;',
                    '&': '&amp;',
                    '"': '&quot;',
                    '\'': '&#x27;',
                    '`': '&#x60;',
                    ",": "&#44;",
                    ".": "&#46;",
                    "(": "&#40;",
                    ")": "&#41;",
                    " ": "&#32;"
                };
                return str.replace(/[<>&"'`,.()]/g, function (match) {
                    return patterns[match];
                })
            },
            makeNPC() {
                // キャラクタ名を設定
                this.charCopyData.data.name=this.char_name
                // 技能のダイスコマンド用の配列を作成
                array_commands=[];
                const re = /[:：\/\>＞»》〉）)\<＜«《〈（(\n]*(\D+)[:：\/\>＞»》〉）)]+(\d{1,3})[％\%\,\n\s]*/g
                var match = this.char_skill.matchAll(re)
                if (match){
                    Array.from(match).forEach(element => {
                        if(this.secretDice){
                            array_commands.push("s"+this.dice+"<="+element[2]+" 【"+element[1]+"】")
                        }else{
                            array_commands.push(this.dice+"<="+element[2]+" 【"+element[1]+"】")
                        }
                    })
                }
                // STRなどのパラメータを追加
                this.param.forEach(element => {
                    const re = new RegExp(element + "[:：\/\>＞»》〉]{0,2}([0-9]{1,3})", "g");
                    var match = re.exec(this.char_data);
                    if (match){
                        this.charCopyData.data.params.push({
                        "label": element,
                        "value": match[1]
                        })
                        if(element==="DEX"){
                            this.charCopyData.data.initiative=parseInt(match[1])
                        }
                        if(this.secretDice){
                            array_commands.push("s"+this.dice+"<={"+element+"}*5 【"+element+"×5】")
                        }else{
                            array_commands.push(this.dice+"<={"+element+"}*5 【"+element+"×5】")
                        }
                    }
                });
                // SANなどのステータスを追加
                this.status.forEach(element => {
                    const re = new RegExp(element + "[:：\/\>＞»》〉]{0,2}([0-9]{1,3})", "g");
                    var match = re.exec(this.char_data)
                    if (match){
                        this.charCopyData.data.status.push({
                        "label": element,
                        "value": match[1],
                        "max": match[1]
                        })
                    }
                });
                // コマンドテキストを作成
                this.charCopyData.data.commands=array_commands.join("\n");
                var str= JSON.stringify(this.charCopyData);
                this.resetData();
                setTimeout(() => this.copyOperation(str), 100);
            },
            async copyOperation(text) {
                await navigator.clipboard.writeText(text)
                alert("コマ作ったよ！")
            }
        }
    })
</script>

</html>
