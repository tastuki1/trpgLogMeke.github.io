<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>ダイスチェックツール</title>
  <h1>成長判定</h1>
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.min.js"></script> -->
  <script type="text/javascript">
    Array.prototype.chunk = function (n) {
      len = Math.round(this.length / n, 10)
      ret = []
      for (var i = 0; i < len; i++) {
        ret.push(this.slice(i * n, i * n + n))
      }
      return ret;
    }
    //おみくじとx回ダイスへの対応用メソッド
    function readRegex(str) {
      const times_regex_g = /x\d+( |　)(CCB|CC|RESB)(.*) (#\d+\n(.*)\n\n)+#\d+\n(.*)(スペシャル|成功|失敗)/g
      const times_with_skill_g = /x\d+( |　)(CCB|CC)&lt;=(\d+)[\+-\d]* 【(.*)】 #\d+\n.*\n\n+#\d+\n.*(スペシャル|成功|失敗)/
      const omikuji_regex_g = /今日のあなたの運勢は……？ \n【.*】/g
      if (str.match(times_regex_g)) {
        res = str.match(times_regex_g)
        for (let r of res) {
          if (times_with_skill_g.test(r)) {
            dice = r.match(times_with_skill_g)
            value = dice[3]
            skill = dice[4]
            r_new = r.split("\n").join(`<br>&lt;=${value} 【${skill}】 `)
          }else{
            r_new = r.split("\n").join('<br>')
          }
          // alert(r_new)
          str = str.replace(r, r_new)
        }
      }
      if (str.match(omikuji_regex_g)) {
        res = str.match(omikuji_regex_g)
        for (let r of res) {
          r_new = r.split("\n").join('<br>')
          // alert(r_new)
          str = str.replace(r, r_new)
        }
      }
      // console.log(str)
      return str
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Noto+Sans+JP');
    @import url('https://fonts.googleapis.com/css2?family=New+Tegomin&family=Sawarabi+Mincho&display=swap');

    html {
      font-size: 16px;
    }

    body {
      -webkit-text-size-adjust: 100%;
      background-color: #6b8e23;
      font-family: 'UD デジタル 教科書体 N-R', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }

    h1 {
      margin: 1rem 2rem 0;
      color: #ffffff;
      font-family: 'UD デジタル 教科書体 N-R', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }

    h2 {
      margin-bottom: .5rem;
    }

    h3 {
      margin: .5rem;
    }

    .disp_check {
      padding-left: .5rem;
      border-collapse: separate;
      border-spacing: 0 1rem;
    }

    .disp_check th {
      vertical-align: top;
      white-space: nowrap;
    }

    .disp_check td {
      display: inline-block;
    }

    .value {
      width: 3rem;
      white-space: nowrap;
    }

    .growth th {
      white-space: nowrap;
    }

    .growth caption {
      padding-left: .5rem;
    }

    .growth td {
      padding-left: 1rem;
    }

    caption {
      white-space: nowrap;
      text-align: left;
    }

    .box5 {
      padding: 1.5rem;
      margin: 1rem;
      border: double 5px #6b8e23;
      background-color: #ffffff;
    }

    @media screen and (max-width: 480px) {
      html {
        font-size: 14px;
      }

      h1 {
        font-size: 30px;
        margin: .5rem 1rem 0;
        color: #ffffff;
        font-family: 'UD デジタル 教科書体 N-R', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      }

      .box5 {
        margin: .5rem;
        padding: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="box5">
    <div id="makeLog">
      確認したいログを選択してください．
      <br><br>
      <input type="file" accept="text/html" id="inputFile" @change="readLogFile">
      <br><br>

      <h3>成長技能チェック</h3>
      <table class="growth">
        <tr v-for="label in labels">
          <td>
            <input type="checkbox" :id="label.labelname" checked="checked" v-model="label.visible" />
            <label class="switch-on" :for="label.labelname">{{ label.labelname }}</label>
          </td>
          <td>
            成長値：0/1d<input type="number" style="width:2rem;" v-model="label.value" />
          </td>
        </tr>
      </table>
      <br><br>

      <h3>対象PC：
        <select style="height:1.5rem; font-style: 1rem;"  v-model="growth_check_PC" @change="resetGrowth">
          <template v-for="char in arr_growth_check">
            <option :value="char">{{ char }}</option>
          </template>
        </select>
      </h3>
      <br>

      <!-- {{ growth_check_PC }} -->

      <table class=disp_check>
        <tr>
          <th>タブ表示　：</th>
          <td v-for="tab in tablist">
            <input type="checkbox" :id="tab.tabname" :value="tab.tabname" v-model="tab_check" />
            <label class="switch-on" :for="tab.tabname">{{ tab.tabname }}</label>
          </td>
          <!-- <td>{{ tab_check }}</td> -->
        </tr>
        <tr>
          <th>オプション：</th>
          <td>
            <input type="checkbox" id="tabname" v-model="tabname.visible" />
            <label class="switch-on" for="tabname">タブ名表示</label>
          </td>
          <td>
            <input type="checkbox" id="value" v-model="value.visible" />
            <label class="switch-on" for="value">出目表示</label>
          </td>
          <td>
            <input type="checkbox" id="status" v-model="status" />
            <label class="switch-on" for="status">ステ依存表示</label>
          </td>
        </tr>
      </table>

      <div id="growth_area">
        <template v-if="result[growth_check_PC]">
          <h3 v-html="'＜'+growth_check_PC+'＞'"></h3>
          <template v-for="label in labels">
            <table class="growth" v-if="result[growth_check_PC][label.labelname]">
              <template v-if="label.visible">
                <caption>◯{{ label.labelname }}　0/1d{{ label.value }}</caption>
                <template v-for="line in result[growth_check_PC][label.labelname]">
                  <template v-if="line.status">
                    <tr v-if="status&&tab_check.includes(line.tabname)">
                      <td v-if="tabname.visible" v-html="'['+line.tabname+']'"></td>
                      <td class="ginou">{{ line.ginou }}</td>
                      <td v-if="value.visible">＞ {{ line.value }}</td>
                    </tr>
                  </template>
                  <template v-else>
                    <tr v-if="tab_check.includes(line.tabname)">
                      <td v-if="tabname.visible" v-html="'['+line.tabname+']'"></td>
                      <td class="ginou">{{ line.ginou }}</td>
                      <td v-if="value.visible">＞ {{ line.value }}</td>
                    </tr>
                  </template>
                </template>
              </template>
            </table>
          </template>
          <br>
        </template>
      </div>
      <br>
      <button type="button" @click="copy">コピーする</button>
      <button type="button" @click="growthDice">成長ダイスを振る</button>

      <br><br>
      <div>
        <template v-for="label in labels">
          <table class="growth">
            <template v-if="label.visible&&map_growth[label.labelname]">
              <caption>◯{{ label.labelname }}</caption>
              <template v-for="line in map_growth[label.labelname]">
                <tr v-if="tab_check.includes(line.tabname)">
                  <td>1D100&lt;={{line.point}}＞{{line.value}}</td>
                  <td style="color: blue;" v-if="line.value <= line.point">成功</td>
                  <td style="color: red;" v-else>失敗</td>
                  <td>【{{line.ginou}}】</td>
                  <td v-if="line.value > line.point">成長値：{{line.growth}}/{{label.value}}</td>
                </tr>
              </template>
            </template>
          </table>
        </template>
      </div>
      <br>
      <div>
        <template >
          <table class="growth">
            <tr><th>＜合計成長値＞</th></tr>
            <template v-for="value,key in sum_growth">
              <tr v-if="value>0">
              <td>{{key}}：</td>
              <td>{{value}}</td>
            </template>
            </tr>
          </table>
        </template>
      </div>
        


      
      
    </div>
</body>

<script>
  var makeLog = new Vue({
    el: "#makeLog",
    data: {
      content: "",
      file: {},
      result: [],
      tablist: [],
      character: [],
      tab_check: [],
      tabname: { visible: true },
      value: { visible: true },
      status: true,
      map_growth: {},
      sum_growth: {},
      labels: [
        {labelname: "クリティカル",visible: true, value: 6 },
        {labelname: "スペシャル", visible: true, value: 3 },
        {labelname: "ファンブル",visible: true, value: 3 },
        {labelname: "初期値成功",visible: true, value: 6 }
      ],
      copyText: "",
      defaultDice: ["&lt;=25 【キック】", "&lt;=25 【組み付き】", "&lt;=50 【こぶし（パンチ）】",
        "&lt;=10 【頭突き】", "&lt;=25 【投擲】", "&lt;=1 【マーシャルアーツ】", "&lt;=20 【拳銃】",
        "&lt;=15 【サブマシンガン】", "&lt;=30 【ショットガン】", "&lt;=15 【マシンガン】", "&lt;=25 【ライフル】",
        "&lt;=30 【応急手当】", "&lt;=1 【鍵開け】", "&lt;=15 【隠す】", "&lt;=10 【隠れる】", "&lt;=25 【聞き耳】",
        "&lt;=10 【忍び歩き】", "&lt;=10 【写真術】", "&lt;=1 【精神分析】", "&lt;=10 【追跡】", "&lt;=40 【登攀】",
        "&lt;=25 【図書館】", "&lt;=25 【目星】", "&lt;=20 【運転】", "&lt;=20 【機械修理】",
        "&lt;=1 【重機械操作】", "&lt;=5 【乗馬】", "&lt;=25 【水泳】", "&lt;=5 【製作】", "&lt;=1 【操縦】",
        "&lt;=25 【跳躍】", "&lt;=10 【電気修理】", "&lt;=10 【ナビゲート】", "&lt;=1 【変装】",
        "&lt;=5 【言いくるめ】", "&lt;=15 【信用】", "&lt;=15 【説得】", "&lt;=5 【値切り】", "&lt;=70 【母国語】",
        "&lt;=5 【医学】", "&lt;=5 【オカルト】", "&lt;=1 【化学】", "&lt;=0 【クトゥルフ神話】", "&lt;=5 【芸術】",
        "&lt;=10 【経理】", "&lt;=1 【考古学】", "&lt;=1 【コンピューター】", "&lt;=5 【心理学】",
        "&lt;=1 【人類学】", "&lt;=1 【生物学】", "&lt;=1 【地質学】", "&lt;=1 【電子工学】", "&lt;=1 【天文学】",
        "&lt;=10 【博物学】", "&lt;=1 【物理学】", "&lt;=5 【法律】", "&lt;=1 【薬学】", "&lt;=20 【歴史】"],
      growth_check_PC: "",
      arr_growth_check: []
    },
    methods: {
      copy() {
        const copyText = this.$el.querySelector('#growth_area').innerText
        navigator.clipboard
          .writeText(copyText)
          .then(() => {
            console.log('テキストコピー完了')
            alert('テキストコピー完了')
          })
          .catch(e => {
            console.error(e)
          })
      },
      resetGrowth(event) {
        // DBへの登録や正規表現での整形などの処理が書ける
        this.growth_check_PC = event.target.value;
        this.map_growth={};
        this.sum_growth={};
      },
      analizeDice(tabname, charname, content) {
        var growth = {};
        var regex = /(\d+)[+-\d]* 【(.*)】.*\(1D100&lt;=\d+\) ＞ (\d+) ＞ (.*)/;
        var regex_d100 = /\(1D100&lt;=\d+\) ＞ (\d+) ＞ (.*)/;
        var content = content.split("<br>")

        for (let cont of content) {
          var dice = {}
          var label = ""
          if (regex_d100.test(cont)) {
            // console.log(cont)
            var res = cont.match(regex_d100)[1]
            if (cont.match(/決定的成功/)) {
              label = "クリティカル";
            } else if (cont.match(/スペシャル/)) {
              label = "スペシャル";
            } else if (cont.match(/致命的失敗/)) {
              label = "ファンブル";
            } else if (cont.match(/成功|スペシャル/)) {
              var judge = cont.match(/&lt;=\d+ 【.*】/)
              if (judge && this.defaultDice.includes(judge[0])) {
                label = "初期値成功";
              }
            }
            if (label != "") {
              var s_regex = /SAN値チェック|STR|CON|POW|DEX|APP|SIZ|INT|EDU|アイデア|幸運|ショックロール|知識/;
              var status = false
              var skill = ""
              //ステータス依存の項目の場合はstatusをtrueにする
              if (s_regex.test(cont)) {
                status = true
              }
              if (regex.test(cont)) {
                point = cont.match(regex)[1];
                skill = cont.match(regex)[2];
              }
              if (!this.result[charname]) {
                this.result[charname] = {};
                this.result[charname][label] = [{ tabname: tabname, ginou: skill, value: res, point: point, status: status }]
              } else if (!this.result[charname][label]) {
                this.result[charname][label] = [{ tabname: tabname, ginou: skill, value: res, point: point, status: status }]
              } else {
                this.result[charname][label].push({ tabname: tabname, ginou: skill, value: res, point: point, status: status })
              }
              this.arr_growth_check.push(charname);
              this.tab_check.push(tabname);
            }
          }
        }
      },
      readLogFile: function (e) {
        this.result = []
        this.tablist = []
        this.character = []
        const files = e.target.files
        this.file = files[0]
        this.logFileName = this.file.name.replace(/\[.+\]\.html/, "")
        var reader = new FileReader()
        reader.readAsText(this.file)
        // ファイル読み込み完了時の処理
        reader.onload = () => {
          var content = reader.result
          // this.content = content
          content = readRegex(content)
          content = content.split(/\n/)
          this.readLog(content)
          alert("ファイル読み込み完了")
        }
        // ファイル読み込みエラー時の処理
        reader.onerror = () => {
          alert("ファイル読み込みエラー")
        }
      },
      readLog(content) {
        var charname, style, color, tabname = ""
        list = ["system"]
        ary = []
        for (var i = 0; i < 10; i++) {
          content.shift()
        }
        content.chunk(8).forEach(line => {
          tabname = line[1].match(/<span> \[(.*)\]</)[1];
          if (!this.tablist.some((u) => u.tabname === tabname)) {
            this.tablist.push({ tabname: tabname, visible: true })
          }
          if (line[1].match(/<span> \[(.*)\]</) && line[2] && line[2].match(/>(.*)</)) {
            charname = line[2].match(/>(.*)</)[1].replace(/\s/, "　").replace(/\:/, "：").replace(/&lt;/, "＜").replace(/&gt;/, "＞")
            if (list.includes(charname)) {
              style = "character"
              ary = ary.filter(item => item.charname != charname)
            } else {
              style = "item"
              list.push(charname)
            }
            this.analizeDice(tabname, charname, line[4])
            ary.push({ charname: charname })
          }
        })
        this.character = ary.sort((a, b) => {
          if (a.charname < b.charname) return -1;
          if (a.charname > b.charname) return 1;
          return 0
        })
        const set1 = new Set(this.arr_growth_check);
        this.arr_growth_check = [...set1];
        const set2 = new Set(this.tab_check);
        this.tab_check = [...set2];

        // console.log(newArr)
      },
      growthDice() {
        this.map_growth = {}
        this.sum_growth = {}
        for(let label of this.labels){
          // console.log(label.labelname)
          if (label.visible && this.result[this.growth_check_PC][label.labelname]){
            for (let line of this.result[this.growth_check_PC][label.labelname]) {
              var growthDice = 0;
              if (this.tab_check.includes(line.tabname)) {
                var hundreddice = Math.floor(Math.random() * 100 + 1);
                if (hundreddice > line.point) {
                  growthDice = Math.floor(Math.random() * label.value + 1);
                }
                console.log(line.ginou)
                if (!status) {
                  if (!line.status){
                    if (!this.map_growth[label.labelname]){
                      this.map_growth[label.labelname] = [{tabname:line.tabname, ginou:line.ginou, value:hundreddice, point:line.point, growth:growthDice}]
                    }else{
                      this.map_growth[label.labelname].push({tabname:line.tabname, ginou:line.ginou, value:hundreddice, point:line.point, growth:growthDice})
                    }
                    if(!this.sum_growth[line.ginou]){
                      this.sum_growth[line.ginou]= growthDice
                    }else{
                      this.sum_growth[line.ginou]+= growthDice
                    }
                  }
                }else{
                  if (!this.map_growth[label.labelname]){
                      this.map_growth[label.labelname] =[{tabname:line.tabname, ginou:line.ginou, value:hundreddice, point:line.point, growth:growthDice}]
                  }else{
                    this.map_growth[label.labelname].push({tabname:line.tabname, ginou:line.ginou, value:hundreddice, point:line.point, growth:growthDice})
                  }
                  if(!this.sum_growth[line.ginou]){
                    this.sum_growth[line.ginou]= growthDice
                  }else{
                    this.sum_growth[line.ginou]+= growthDice
                  }
                }
              }
            }
          }
        }
      }
    }
  })
</script>

</html>
