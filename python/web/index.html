<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>My First App</title>
</head>
<body>
    <h1>JavaScript</h1>
    <main>
        <div id="sample">
            <button @click="countUP">OK</button>
            <p>{{ count }}</p>
        </div>
    </main>

    <script>
        let count = 0;
        async function onClickOk(){
            count+=1;
            console.log(count);
        }
    </script>
</body>
<script>
    var sample = new Vue({
        el: "#sample",
        data: {
            count:1
        },
        methods: {
            async countUP() {
                this.count = await pywebview.api.add(this.count, 15);
            }

        }
    })
</script>
</html>
