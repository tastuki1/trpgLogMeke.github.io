    <script type="text/javascript">
        Array.prototype.chunk = function (n) {
            len = Math.round(this.length / n, 10)
            ret = []
            for (var i = 0; i < len; i++) {
                ret.push(this.slice(i * n, i * n + n))
            }
            return ret;
        }
        //おみくじとx回ダイスへの対応用メソッド
        function readRegex(str) {
            const log_regex_g = /x\d+ CCB(.*) (#\d+\n(.*)\n\n)+#\d+\n(.*)(スペシャル|成功|失敗)/g
            const omikuji_regex_g = /今日のあなたの運勢は……？ \n【.*】/g
            if (str.match(log_regex_g)) {
                res = str.match(log_regex_g)
                for (let r of res) {
                    // alert(r)
                    r_new = r.split("\n").join('<br>')
                    // alert(r_new)
                    str = str.replace(r, r_new)
                }
            } else if (str.match(omikuji_regex_g)) {
                res = str.match(omikuji_regex_g)
                for (let r of res) {
                    // alert(r)
                    r_new = r.split("\n").join('<br>')
                    // alert(r_new)
                    str = str.replace(r, r_new)
                }
            }
            return str
        }
    </script>

<script>

    var makeLog = new Vue({
        el: "#makeLog",
        data: {
            content: [],
            logFileName: "log"
        },
        methods: {
            htmlSafe(str) {
                if (typeof str !== 'string') return str;
                var patterns = {
                    '<': '&lt;',
                    '>': '&gt;',
                    '&': '&amp;',
                    '"': '&quot;',
                    '\'': '&#x27;',
                    '`': '&#x60;',
                    ",": "&#44;",
                    ".": "&#46;",
                    "(": "&#40;",
                    ")": "&#41;",
                    " ": "&#32;"
                };
                return str.replace(/[<>&"'`,.()]/g, function (match) {
                    return patterns[match];
                })
            },
            copy() {
                const copyText = this.$el.querySelector('#growth_area').innerText
                navigator.clipboard
                    .writeText(copyText)
                    .then(() => {
                        alert('テキストコピー完了')
                        console.log('テキストコピー完了')
                    })
                    .catch(e => {
                        console.error(e)
                    })
            },
            readLogFile: function (e) {
                // this.result = []
                // this.tablist = [{ tabname: "メイン", color: "#ffffff", visible: true }, { tabname: "情報", color: "#ffffff", visible: true }]
                // this.character = []
                // this.component = []
                const files = e.target.files
                this.file = files[0]
                this.logFileName = this.file.name.replace(/\[.+\](.*)/, "").replace(/\.html/, "")
                var reader = new FileReader()
                reader.readAsText(this.file)
                // ファイル読み込み完了時の処理
                reader.onload = () => {
                    //これまでに読み込んだファイルの内容
                    var array1 = this.content;
                    array1.splice(this.content.length - 1, 1);
                    //新規に読み込んだファイルの内容
                    var array2 = reader.result.split(/\n\s\s\s\s\n/);
                    this.content = Array.from(new Set([...array1, ...array2]));
                    alert("ファイル読み込み完了")
                }
                // ファイル読み込みエラー時の処理
                reader.onerror = () => {
                    alert("ファイル読み込みエラー")
                }
            },
            logFileData() {
                var result = window.confirm("ダウンロードしますか？");
                if (result) {
                    var textContent = this.content.join('\n    \n')
                    const blob = new Blob([textContent], { type: "text/html" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = this.logFileName + '.html';
                    link.click();

                }
            }
        }
    })
</script>
